name: Samsung release

# GitHub-hosted counterpart of the upstream self-hosted pipeline.
# Builds: manager signing key -> kernelsu.ko (DDK) -> ksud -> manager APK -> repacked APK.
on:
  push:
    tags:
      - "sukisu-*"
  workflow_dispatch:

permissions:
  contents: write

env:
  KMI: android15-6.6
  DDK_RELEASE: "20260828"
  PACKAGE_NAME: com.sukisu.nova
  KEY_ALIAS: pr-key

jobs:
  # ---------------------------------------------------------------- signing key
  key:
    runs-on: ubuntu-latest
    outputs:
      expected_size: ${{ steps.export.outputs.size }}
      expected_hash: ${{ steps.export.outputs.hash }}
      keystore: ${{ steps.export.outputs.keystore }}
      keystore_password: ${{ steps.export.outputs.store_pass }}
      key_password: ${{ steps.export.outputs.key_pass }}
      version_code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version code
        id: version
        run: |
          set -eux
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "code=$((30000 + COMMIT_COUNT + 996))" >> "$GITHUB_OUTPUT"

      - name: Generate keystore and export certificate
        id: export
        run: |
          set -eux
          STORE_PASS=$(openssl rand -hex 16)
          KEY_PASS=$(openssl rand -hex 16)
          keytool -genkeypair -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Samsung CI Build" -storetype JKS -keystore key.jks
          keytool -exportcert -alias "$KEY_ALIAS" -keystore key.jks \
            -storepass "$STORE_PASS" -file cert.der
          SIZE_DEC=$(stat -c%s cert.der)
          SIZE_HEX=$(printf '0x%04x' "$SIZE_DEC")
          HASH=$(sha256sum cert.der | awk '{print $1}')
          {
            echo "size=$SIZE_HEX"
            echo "hash=$HASH"
            echo "store_pass=$STORE_PASS"
            echo "key_pass=$KEY_PASS"
            echo "keystore=$(base64 -w 0 key.jks)"
          } >> "$GITHUB_OUTPUT"
          echo "cert size=$SIZE_HEX hash=$HASH"

  # ------------------------------------------------------------------ kernel ko
  lkm:
    needs: key
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build kernelsu.ko
        env:
          EXPECTED_SIZE: ${{ needs.key.outputs.expected_size }}
          EXPECTED_HASH: ${{ needs.key.outputs.expected_hash }}
          VERSION_CODE: ${{ needs.key.outputs.version_code }}
        run: |
          set -eux
          cd kernel
          make -j"$(nproc)" \
            CONFIG_KSU=m CONFIG_KPM=y CC=clang \
            KSU_PACKAGE_NAME="$PACKAGE_NAME" \
            KSU_EXPECTED_SIZE="$EXPECTED_SIZE" \
            KSU_EXPECTED_HASH="$EXPECTED_HASH" \
            KSU_VERSION="$VERSION_CODE" \
            KSU_BUILD_REF=release
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp kernelsu.ko "$GITHUB_WORKSPACE/out/${KMI}_kernelsu.ko"
          llvm-strip -d "$GITHUB_WORKSPACE/out/${KMI}_kernelsu.ko"
          ls -la "$GITHUB_WORKSPACE/out/"

      - uses: actions/upload-artifact@v4
        with:
          name: lkm-aarch64
          path: out/*.ko

  # ---------------------------------------------------------------------- ksud
  ksud:
    needs: [key, lkm]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lkm-aarch64
          path: lkm-out

      - name: Prepare ksud assets
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eux
          case "$TARGET" in
            aarch64-linux-android) ARCH=aarch64 ;;
            armv7-linux-androideabi) ARCH=arm ;;
            x86_64-linux-android) ARCH=x86_64 ;;
          esac
          cp lkm-out/*.ko "userspace/ksud/bin/$ARCH/"
          ls -la "userspace/ksud/bin/$ARCH/"

      - name: Setup Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eux
          rustup target add "$TARGET"
          cargo install cargo-ndk --locked || true

      - name: Build ksud
        env:
          TARGET: ${{ matrix.target }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -eux
          source .github/scripts/setup-rust-build.sh "$TARGET" 26
          cargo build --target "$TRIPLE" --release \
            --manifest-path ./userspace/ksud/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: ksud-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/ksud

  # ------------------------------------------------------------------- manager
  manager:
    needs: [key, ksud]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Write signing key
        env:
          KEYSTORE: ${{ needs.key.outputs.keystore }}
          STORE_PASS: ${{ needs.key.outputs.keystore_password }}
          KEY_PASS: ${{ needs.key.outputs.key_password }}
        run: |
          set -eux
          cd manager
          echo "$KEYSTORE" | base64 -d > key.jks
          {
            echo KEYSTORE_PASSWORD="$STORE_PASS"
            echo KEY_ALIAS="$KEY_ALIAS"
            echo KEY_PASSWORD="$KEY_PASS"
            echo KEYSTORE_FILE='key.jks'
          } >> gradle.properties

      - name: Copy ksud to jniLibs
        run: |
          set -eux
          cd manager
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a app/src/main/jniLibs/x86_64
          ARM64_KSUD=$(find ../artifacts/ksud-aarch64-linux-android -type f -name ksud | head -n 1)
          ARM_KSUD=$(find ../artifacts/ksud-armv7-linux-androideabi -type f -name ksud | head -n 1)
          X86_64_KSUD=$(find ../artifacts/ksud-x86_64-linux-android -type f -name ksud | head -n 1)
          test -n "$ARM64_KSUD"; test -n "$ARM_KSUD"; test -n "$X86_64_KSUD"
          cp -f "$ARM64_KSUD" app/src/main/jniLibs/arm64-v8a/libksud.so
          cp -f "$ARM_KSUD" app/src/main/jniLibs/armeabi-v7a/libksud.so
          cp -f "$X86_64_KSUD" app/src/main/jniLibs/x86_64/libksud.so

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          set -eux
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "ndk;29.0.14206865" || \
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          set -eux
          cd manager
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: manager-gradle
          path: manager/app/build/outputs/apk/release/*.apk

  # -------------------------------------------------------------------- repack
  repack:
    needs: [key, manager]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: manager-gradle
          path: gradle-apk

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare signing inputs
        env:
          KEYSTORE: ${{ needs.key.outputs.keystore }}
        run: |
          set -eux
          echo "$KEYSTORE" | base64 -d > key.jks
          mkdir -p manager/app/build/outputs/apk/release
          cp gradle-apk/*.apk manager/app/build/outputs/apk/release/
          mkdir -p target/aarch64-linux-android/release target/armv7-linux-androideabi/release target/x86_64-linux-android/release
          cp artifacts/ksud-aarch64-linux-android/ksud target/aarch64-linux-android/release/ksud
          cp artifacts/ksud-armv7-linux-androideabi/ksud target/armv7-linux-androideabi/release/ksud
          cp artifacts/ksud-x86_64-linux-android/ksud target/x86_64-linux-android/release/ksud
          chmod +x target/*/release/ksud
          ls -l target/*/release/ksud manager/app/build/outputs/apk/release/

      - name: Repack and resign
        env:
          STORE_PASS: ${{ needs.key.outputs.keystore_password }}
          KEY_PASS: ${{ needs.key.outputs.key_password }}
        run: |
          set -eux
          python3 repack_apk.py repack \
            -b release -t release \
            -a arm64-v8a -a armeabi-v7a -a x86_64 \
            -K key.jks -A "$KEY_ALIAS" -P "$STORE_PASS" -S "$KEY_PASS" \
            --strip
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: manager-repacked
          path: dist/*.apk

  # ------------------------------------------------------------------- publish
  publish:
    needs: [key, lkm, repack]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: Collect assets
        run: |
          set -eux
          mkdir -p assets
          find out -name '*.apk' -exec cp {} assets/ \;
          find out -name '*.ko' -exec cp {} assets/ \;
          ls -la assets/

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
